name: Testes ATDD

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o codigo do repositorio
        uses: actions/checkout@v4

      - name: Instalar o Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Liberar execucao do Maven Wrapper
        run: chmod +x ./mvnw

      - name: Rodar os testes
        run: ./mvnw -B test

      - name: Guardar o relatorio dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes-${{ github.run_number }}
          path: target/surefire-reports/
          if-no-files-found: ignore

      - name: Guardar o relatorio de cobertura JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-jacoco-${{ github.run_number }}
          path: target/site/jacoco/
          if-no-files-found: ignore
